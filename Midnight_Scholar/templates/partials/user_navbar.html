<header>
  <nav>
    <a href="{% url 'home' %}" class="logo-link">
      <h3 class="logo" id="logo-link">The Midnight Scholar</h3>
    </a>

    <div class="links">
      <ul>
        <li>
          <a href="{% url 'user_borrowed' %}"
            {% if request.resolver_match.url_name == 'user_borrowed' %}class="active-nav-link"{% endif %}>
            My Books
          </a>
        </li>
        <li>
          <a href="{% url 'user_dashboard' %}"
            {% if request.resolver_match.url_name == 'user_dashboard' %}class="active-nav-link"{% endif %}>
            Dashboard
          </a>
        </li>
        <li>
          <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit" class="nav-logout-btn" style="transform: none;">Logout</button>
          </form>
        </li>
      </ul>
    </div>

    <div class="search-profile">
      <a href="{% url 'user_search' %}" aria-label="Search">
        <i class="fa-solid fa-magnifying-glass"></i>
      </a>
      <a href="{% url 'user_dashboard' %}" aria-label="Profile">
        <i class="fa-solid fa-circle-user"></i>
      </a>
    </div>
  </nav>
</header>
