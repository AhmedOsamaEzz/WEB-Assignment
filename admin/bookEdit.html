<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <title>edit book</title>
  </head>

  <body>
    <header>
      <nav class="nav-bar">
        <div class="title">
          <h1 class="brand-title">The Midnight Scholar</h1>
        </div>
        <div class="nav-links">
          <a href="../index.html">Home</a>
          <a href="bookList.html">Book List</a>
          <a href="dashboard.html">Dashboard</a>
          <a href="../auth/login.html">Logout</a>
        </div>
        <div class="tools">
          <span  class="material-symbols-outlined" " > search </span>
          <span class="material-symbols-outlined"> notifications </span>
          <span class="material-symbols-outlined"> account_circle </span>
        </div>
      </nav>
    </header>

    <form class="book-edit-container">
      <div class="book-image-section">
        <label for="image">Book image</label>
        <img id="image" src="/assets/images/download.webp" alt="" />
      </div>

      <div class="book-info-section">
        <div class="label-input">
          <label for="title">Book Title</label>
          <input id="title" placeholder="enter the book title" />
        </div>

        <div class="same-row">
          <div class="label-input">
            <label for="author">Book Author</label>
            <input
              id="author"
              type="text"
              placeholder="enter the book Author"
            />
          </div>
          <div class="label-input">
            <label for="isbn">Book ISBN</label>
            <input id="isbn" type="text" placeholder="enter the book ISBN" />
          </div>
        </div>

        <div class="same-row">
          <div class="label-input">
            <label for="publicationYear">Publication Year</label>
            <input
              id="publicationYear"
              type="text"
              placeholder="enter the book Publication year"
            />
          </div>
          <div class="label-input">
            <label for="publisher">Publisher</label>
            <input
              id="publisher"
              type="text"
              placeholder="enter the book Publisher"
            />
          </div>
        </div>

        <div class="label-input">
          <label for="totalCopies">Book Total Copies</label>
          <input
            id="totalCopies"
            type="number"
            placeholder="enter the book Total Copies"
          />
        </div>

        <div class="label-input">
          <label for="description">Book description</label>
          <textarea
            id="description"
            placeholder="enter the book description"
          ></textarea>
        </div>
      </div>

      <button type="submit">submit</button>
    </form>
  </body>
</html>
