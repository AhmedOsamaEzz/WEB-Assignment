<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/normalize.css" />
    <script src="../assets/Javascript/UI/authUI.js"></script>

    <title>nice library</title>
  </head>

  <body id="login-page">
    <main class="main-content">
      <div class="bg-blur blur-primary"></div>
      <div class="bg-blur blur-secondary"></div>

      <div class="login-container">
        <header class="brand-header">
          <h1 class="brand-title">The Midnight Scholar</h1>
          <p class="brand-subtitle">Private Archival Access</p>
        </header>
        <div class="login-card">
          <form class="login-form">
            <label for="email" class="form-label">username (email)</label>
            <input type="text" placeholder="username@gmail.com" class="input-field" id = "login-email"/>
            <div class="error-msg" id="login-email-error"></div>

            <label for="password" class="form-label">password</label>
            <input type="password" placeholder="******" class="input-field" id = "login-password"/>
            <div class="error-msg" id="login-password-error"></div>
            <!-- TODO  -->
            <!-- add forgot password here later -->
            <div class="checkbox-group">
              <label class="checkbox-container">Stay Logged in
                <input type="checkbox" id="remember-login" />
                <span class="checkmark"></span>
              </label>
            </div>

            <button type="submit" class="btn-primary">Login</button>
          </form>
        </div>
        <div class="link">
          <p class="sans-text">
            Don't have an account? <a href="signup.html">Sign up!</a>
          </p>
        </div>
      </div>
    </main>
    <div class="footer-divider"></div>
    <footer class="global-footer">
      <p class="name">The Midnight Scholar</p>
      <div class="cnt">
        <p><a href="#">PRIVACY POLICY</a></p>
        <p><a href="#">TERMS OF ACCESS</a></p>
        <p><a href="#">CONTACT CURATOR</a></p>
      </div>
      <p class="copyrights">
        &copy; 2026 The Midnight Scholar Private Archive. All rights reserved.
      </p>
    </footer>
  </body>
</html>
