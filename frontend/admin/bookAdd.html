<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Midnight Scholar - Add Book</title>
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/normalize.css" />
    <script
      src="https://kit.fontawesome.com/80d75008f5.js"
      crossorigin="anonymous"></script>
    <script type="module" src="../assets/Javascript/UI/authUI.js" defer></script>
    <script type="module" src="../assets/Javascript/UI/adminUI.js"></script>
  </head>
  <title>add book</title>
</head>

<body>
  <header>
    <nav>
      <h3 class="logo"><a href="../index.html"> Midnight Scholar</a></h3>

      <div class="links">
        <ul>
          <li><a href="../index.html">Home</a></li>
          <li><a href="bookList.html">All Books</a></li>
          <li><a href="dashboard.html">Dashboard</a></li>
          <li><a href="#" id="logout-link">Logout</a></li>
        </ul>
      </div>

      <div class="search-profile">
        <a href="search.html"><i class="fa-solid fa-magnifying-glass"></i></a>
        <a href="dashboard.html"><i class="fa-solid fa-circle-user"></i></a>
      </div>
    </nav>
  </header>

  <form class="book-edit-container">
    <div class="book-image-section">
      <label for="image">Book cover</label>
      <img id="image" src="../assets/images/unnamed.png" alt />
      <input type="file" id="fileInput" accept="image/*" style="display: none;">
      <div class="upload-icon"><i class="fas fa-camera"></i> </div>
    </div>

    <div class="book-info-section">
      <div class="label-input">
        <label for="title">Book Title</label>
        <input id="title" placeholder="Enter the book title" />
      </div>

      <div class="same-row">
        <div class="label-input">
          <label for="author">Book Author</label>
          <input id="author" type="text"
            placeholder="Enter the book Author" />
        </div>
        <div class="label-input">
          <label for="isbn">Book ISBN</label>
          <input id="isbn" type="text" placeholder="Enter the book ISBN" />
        </div>
      </div>

      <div class="label-input">
        <label for="category">Category</label>
        <select id="category">
          <option value>Select a category</option>
          <option value="self-help">Self-Help</option>
          <option value="programming">Programming</option>
          <option value="math">Math</option>
          <option value="history">History</option>
          <option value="fiction">Fiction</option>
          <option value="science">Science</option>
          <option value="psychology">Psychology</option>
          <option value="other">Other</option>
        </select>
      </div>

      <div class="same-row">
        <div class="label-input">
          <label for="publicationYear">Publication Year</label>
          <input id="publicationYear" type="text"
            placeholder="Enter the book Publication year" />
        </div>
        <div class="label-input">
          <label for="publisher">Publisher</label>
          <input id="publisher" type="text"
            placeholder="Enter the book Publisher" />
        </div>
      </div>

      <div class="label-input">
        <label for="totalCopies">Book Total Copies</label>
        <input id="totalCopies" type="number"
          placeholder="Enter the book Total Copies" />
      </div>

      <div class="label-input">
        <label for="description">Book description</label>
        <textarea id="description"
          placeholder="Enter the book description"></textarea>
      </div>
      <div class="form-button">
        <button class="btn-primary" id="addbtn" type="submit">submit</button>
      </div>
    </div>
  </form>

  <hr class="global-hr">
    <footer class="global-footer">
      <p class="name">The Midnight Scholar</p>
      <div class="cnt">
        <p><a href="#">PRIVACY POLICY</a></p>
        <p><a href="#">TERMS OF ACCESS</a></p>
        <p><a href="#">CONTACT CURATOR</a></p>
      </div>
      <p class="copyrights">
        &copy; 2026 The Midnight Scholar Private Archive. All rights reserved.
      </p>
    </footer>
  </body>
</html>
