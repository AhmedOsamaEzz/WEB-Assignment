<!doctype html>
<html lang="en">
  <html>
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <link rel="stylesheet" href="../assets/css/normalize.css" />
      <link rel="stylesheet" href="../assets/css/style.css" />
      <script
        src="https://kit.fontawesome.com/80d75008f5.js"
        crossorigin="anonymous"></script>
      <script type="module" src="../assets/Javascript/UI/authUI.js"></script>
      <script src="../assets/Javascript/bookList.js"></script>
      <title>List of All Books</title>
    </head>

    <body id="bookList-page">
      <header>
        <nav>
          <h3 class="logo"><a href="../index.html">The Midnight Scholar</a></h3>

          <div class="links">
            <ul>
              <li><a href="../index.html">Home</a></li>
              <li><a href="borrowed.html">My Books</a></li>
              <li><a href="dashboard.html">Dashboard</a></li>
              <li><a href="#" id="logout-link">Logout</a></li>
            </ul>
          </div>

          <div class="search-profile">
            <a href="search.html"><i
                class="fa-solid fa-magnifying-glass"></i></a>
            <a href="dashboard.html"><i class="fa-solid fa-circle-user"></i></a>
          </div>
        </nav>
      </header>

      <main class="main-bookList">
        <br />
        <table class="table-section">
          <thead>
            <tr>
              <th>Title</th>
              <th>Author</th>
              <th>Category</th>
              <th class="books-count">Total</th>
              <th class="books-count">Available</th>
              <th class="books-count">Borrowed</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>
                <div class="book-title-column">
                  <img
                    src="../assets/images/unnamed.png"
                    class="mini-book-image" />
                  <div>
                    <label class="book-title-text">Title 1</label>
                    <br />
                    <label class="book-isbn-label">ISBN-0000</label>
                  </div>
                </div>
              </td>
              <td>Author 1</td>
              <td><label class="book-category-column">Category 1</label></td>
              <td class="books-count">0</td>
              <td class="books-count">0</td>
              <td class="books-count">0</td>
              <td class="book-action-column">
                <div class="book-action-cell">
                  <button onclick="editBook('${book.isbn}')">
                    <i class="fa-solid fa-pen"></i>
                  </button>
                  <button onclick="deleteBook('${book.isbn}')">
                    <i class="fa-solid fa-trash-can"></i>
                  </button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>

        <br />
        <div class="table-options-section">
          <button
            type="button"
            class="btn-primary"
            onclick="window.location.href = 'bookEdit.html'">
            Add Book
          </button>
          <div class="table-pagination">
            <button class="prev-btn">←</button>
            <!-- page number buttons are generated by JavaScript -->
            <div class="page-numbers">
              <button class="current-button">1</button>
              <button class="not-current-button">2</button>
              <button class="not-current-button">3</button>
            </div>
            <button class="next-btn">→</button>
          </div>
        </div>
        <br />
      </main>

      <hr class="global-hr" />
      <footer class="global-footer">
        <p class="name">The Midnight Scholar</p>
        <div class="cnt">
          <p><a href="#">PRIVACY POLICY</a></p>
          <p><a href="#">TERMS OF ACCESS</a></p>
          <p><a href="#">CONTACT CURATOR</a></p>
        </div>
        <p class="copyrights">
          &copy; 2026 The Midnight Scholar Private Archive. All rights reserved.
        </p>
      </footer>
    </body>
  </html>
</html>
