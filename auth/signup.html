<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../assets/css/style.css"/>
    <title>nice library</title>
  </head>

  <body>

    <main class = "main-content">
      <div class="bg-blur blur-primary"></div>
      <div class="bg-blur blur-secondary"></div>

      
      <div class = "signup-container">
            <header class="brand-header">
                <h1 class="brand-title">Create An Account</h1>
                <p class="brand-subtitle">Join the archives</p>
            </header>
          <div class = "signup-card">
            <form class = "signup-form">
              <label for = "signup-name" class = "form-label">Full Name</label>
              <input type="text" placeholder="username@gmail.com" class = "input-field"/>

              <label for = "signup-email" class = "form-label">username (email)</label>
              <input type="text" placeholder="username@gmail.com" class = "input-field"/>

              <label for = "signup-password" class = "form-label">password</label>
              <input type="text" placeholder="******" class = "input-field"/>

              <div class="checkbox-group">
                <label class="checkbox-container">Admin Account
                  <input type="checkbox" id="create-admin-account"/>
                  <span class="checkmark"></span>
                </label>
              </div>
              
              <button type = "button" class="btn-primary" onclick="window.location.href='../index.html'">Login</button>
            </form>
          </div>
      <div class="link">
       <p class="sans-text">Already have an account? <a href="login.html">Login!</a></p>
      </div>
      </div>

    </main>
  </body>
  <footer>

  </footer>
</html>
